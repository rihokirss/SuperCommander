name: Windows
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: npm ci
      - run: cargo fmt --all -- --check
      - run: cargo test -p commander-core --locked
      - run: cargo test -p commander-core --test clipboard --locked -- --ignored
      - run: npm test
      - run: npx playwright install chromium
      - run: npm run test:ui
      - name: Ensure WebView2 runtime for native tests
        run: ./scripts/ci-webview.ps1
      - run: npm run tauri build
        id: windows_build
      - run: node scripts/windows-clipboard-smoke.mjs
      - run: node scripts/windows-properties-smoke.mjs
      - run: node scripts/windows-search-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-properties-evidence
          path: |
            artifacts/native-properties*.png
            artifacts/native-bookmarks*.png
            artifacts/native-permissions*.png
            artifacts/native-search*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-clipboard-evidence
          path: artifacts/native-clipboard-*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always() && steps.windows_build.outcome == 'success'
        with:
          name: SuperCommander-windows-x64
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/supercommander.exe
          if-no-files-found: error
