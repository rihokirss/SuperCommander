name: Windows
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: npm ci
      - run: cargo fmt --all -- --check
      - run: cargo test -p commander-core --locked
      - run: cargo test -p commander-core --test clipboard --locked -- --ignored
      - run: npm test
      - run: npx playwright install chromium
      - run: npm run test:ui
      - name: Ensure WebView2 runtime for native tests
        run: ./scripts/ci-webview.ps1
      - name: Build Windows application
        id: windows_build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
        run: |
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            npm run tauri build -- --config src-tauri/tauri.updater.conf.json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
            $portable = "target/release/bundle/nsis/SuperCommander_${version}_x64_portable.exe"
            Copy-Item target/release/supercommander.exe $portable
            npx tauri signer sign $portable --app-version $version
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node scripts/updater-manifest.mjs
          } else {
            npm run tauri build
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: node scripts/windows-clipboard-smoke.mjs
      - run: node scripts/windows-startup-smoke.mjs
      - run: node scripts/windows-quit-smoke.mjs
      - run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/windows-updater-smoke.ps1
      - run: node scripts/windows-window-state-smoke.mjs
      - run: node scripts/windows-taskbar-smoke.mjs
      - run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/windows-first-show.ps1 -Executable target/release/supercommander.exe
      - run: node scripts/windows-theme-smoke.mjs
      - run: node scripts/windows-terminal-resize-smoke.mjs
      - run: node scripts/windows-terminal-tabs-smoke.mjs
      - run: node scripts/windows-folder-size-smoke.mjs
      - run: node scripts/windows-properties-smoke.mjs
      - run: node scripts/windows-search-smoke.mjs
      - run: node scripts/windows-transfer-smoke.mjs
      - run: node scripts/windows-queue-smoke.mjs
      - run: node scripts/windows-comparison-smoke.mjs
      - run: node scripts/windows-tooltip-smoke.mjs
      - run: node scripts/windows-recovery-smoke.mjs
      - run: node scripts/windows-rename-smoke.mjs
      - run: node scripts/windows-archive-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-properties-evidence
          path: |
            artifacts/native-properties*.png
            artifacts/native-bookmarks*.png
            artifacts/native-permissions*.png
            artifacts/native-search*.png
            artifacts/native-viewer-find*.png
            artifacts/native-transfers*.png
            artifacts/native-queue*.png
            artifacts/native-comparison*.png
            artifacts/native-recovery*.png
            artifacts/native-rename*.png
            artifacts/native-archive*.png
            artifacts/sky-terminal-*.png
            artifacts/sky-palettes-*.png
            artifacts/native-folder-sizes.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-clipboard-evidence
          path: artifacts/native-clipboard-*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always() && steps.windows_build.outcome == 'success'
        with:
          name: SuperCommander-windows-x64
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/nsis/*-setup.exe.sig
            target/release/bundle/nsis/latest.json
            target/release/bundle/nsis/portable.json
            target/release/bundle/nsis/*_x64_portable.exe
            target/release/bundle/nsis/*_x64_portable.exe.sig
            target/release/supercommander.exe
          if-no-files-found: error
