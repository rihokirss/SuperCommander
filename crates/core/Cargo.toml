[package]
name = "commander-core"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
regex = "1"
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
trash = "5"
base64 = "0.22"
dirs = "6"
notify = "8"
portable-pty = "0.9"
russh = { version = "0.63", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "3"
tokio = { version = "1", features = ["full"] }
keyring = { version = "3", features = ["windows-native"] }
sha2 = "0.11"
glob = "0.3"

[dev-dependencies]
tempfile = "3"
