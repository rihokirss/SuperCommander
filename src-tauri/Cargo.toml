[package]
name = "supercommander"
version = "0.4.7"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
commander-core = { path = "../crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
notify = "8"
open = "5"
anyhow = "1"
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
window-vibrancy = "0.8"
windows-registry = "0.6"
sha2 = "0.11"
tempfile = "3"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }
tauri-plugin-single-instance = "2"
